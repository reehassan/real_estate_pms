# ─────────────────────────────────────────────────────────────────
# nginx/default.conf — Royal Land PMS Local Dev
#
# - Serves /static/ and /media/ directly from mounted volumes
# - Proxies everything else to Gunicorn on app:8000
# - 50 MB client_max_body_size for document uploads
# ─────────────────────────────────────────────────────────────────

upstream django {
    server app:8000;
}

server {
    listen 80;
    server_name localhost;

    # ── Upload size (booking documents, project logos) ────────────
    client_max_body_size 50M;

    # ── Static files (Unfold CSS/JS, admin assets) ────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files (project logos, booking documents, receipts) ──
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Challan PDFs — longer timeout for WeasyPrint rendering ────
    location /challans/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # WeasyPrint can take a few seconds
        proxy_send_timeout 120s;
    }

    # ── All other requests → Gunicorn ─────────────────────────────
    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;
}