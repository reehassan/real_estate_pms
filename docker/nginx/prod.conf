# =============================================================================
# nginx/prod.conf — Royal Land PMS  (Production)
# =============================================================================
# - Port 80  → permanent redirect to HTTPS
# - Port 443 → SSL termination, static/media, reverse proxy to Gunicorn
# - WeasyPrint challan endpoint gets 120s read timeout
# - Gzip enabled for all text assets
# =============================================================================

# Upstream: Gunicorn inside Docker network
upstream django {
    server app:8000;
    keepalive 16;   # reuse connections to Gunicorn
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;           # catch-all — replace with your domain in prod

    # Let's Encrypt ACME challenge (Certbot webroot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: permanent redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;           # replace with: server_name yourdomain.com www.yourdomain.com;

    # ── SSL certificates (Certbot / Let's Encrypt) ───────────────────────────
    # Before first deploy, copy certs here OR use certbot --nginx plugin.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS — tell browsers to always use HTTPS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Other security headers
    add_header X-Content-Type-Options  nosniff           always;
    add_header X-Frame-Options         SAMEORIGIN        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Upload size (booking documents, project logos) ────────────────────────
    client_max_body_size 50M;

    # ── Static files ─────────────────────────────────────────────────────────
    location /static/ {
        alias   /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    # ── Media files ──────────────────────────────────────────────────────────
    location /media/ {
        alias   /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Challan PDF — extended timeout for WeasyPrint ────────────────────────
    location /challans/ {
        proxy_pass          http://django;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
    }

    # ── All other requests → Gunicorn ────────────────────────────────────────
    location / {
        proxy_pass          http://django;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_min_length 1024;

    # ── Deny access to hidden files (.env, .git, etc.) ───────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}