# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — Royal Land PMS Local Dev
#
# Services:
#   db    — PostgreSQL 16
#   app   — Django + Gunicorn
#   nginx — Reverse proxy, static/media file serving
#
# Usage:
#   docker-compose up --build          # first run
#   docker-compose up                  # subsequent runs
#   docker-compose exec app python manage.py migrate
#   docker-compose exec app python manage.py createsuperuser
#   docker-compose exec app python manage.py seed_data
#   docker-compose down -v             # stop + remove volumes
# ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  # ── Django + Gunicorn ───────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    command:
      - sh
      - -c
      - "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --reload --access-logfile - --error-logfile -"

  # ── Nginx ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - app


# ── Named volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
  static_volume:
  media_volume: