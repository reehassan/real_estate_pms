# =============================================================================
# .gitlab-ci.yml — Royal Land PMS
# =============================================================================

stages:
  - test
  - deploy

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — TEST
# ─────────────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: python:3.13-slim

  services:
    - name: postgres:16-alpine
      alias: postgres

  variables:
    POSTGRES_DB:                test_db
    POSTGRES_USER:              test_user
    POSTGRES_PASSWORD:          test_pass
    POSTGRES_HOST_AUTH_METHOD:  trust
    DJANGO_SETTINGS_MODULE:     config.settings.development
    SECRET_KEY:                 ci-test-secret-key-not-used-in-prod
    DB_NAME:                    test_db
    DB_USER:                    test_user
    DB_PASSWORD:                test_pass
    DB_HOST:                    postgres
    DB_PORT:                    "5432"
    PIP_CACHE_DIR:              "$CI_PROJECT_DIR/.cache/pip"

  cache:
    key:
      files:
        - requirements.dev.txt
    paths:
      - .cache/pip
    policy: pull-push

  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        libpango-1.0-0
        libpangoft2-1.0-0
        libpangocairo-1.0-0
        libglib2.0-0
        libgdk-pixbuf-2.0-0
        shared-mime-info
        fonts-liberation
        fonts-dejavu-core
    - pip install --upgrade pip
    - pip install -r requirements.dev.txt

  script:
    - python manage.py test --verbosity=2

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — DEPLOY
# ─────────────────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

  environment:
    name: production
    url: http://$VPS_HOST/admin

  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' > /tmp/deploy_key
    - chmod 400 /tmp/deploy_key
    - ssh-add /tmp/deploy_key
    - rm -f /tmp/deploy_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      ssh "$VPS_USER@$VPS_HOST" bash << 'DEPLOY'
        set -e

        APP_DIR="/opt/royal-land"
        COMPOSE_FILE="$APP_DIR/docker/docker-compose.prod.yml"
        COMPOSE="docker compose -f $COMPOSE_FILE"
        IMAGE="royal-land-pms:prod"
        HEALTH_URL="http://127.0.0.1:80/admin/login/"

        # ── 1. Save rollback target ───────────────────────────────────────────
        echo "==> [1/5] Saving current image as rollback target..."
        if docker image inspect "$IMAGE" > /dev/null 2>&1; then
          docker tag "$IMAGE" "royal-land-pms:previous"
          echo "    Saved royal-land-pms:previous"
        else
          echo "    No existing image — first deploy, skipping."
        fi

        # ── 2. Pull latest code ───────────────────────────────────────────────
        echo "==> [2/5] Pulling latest code..."
        cd "$APP_DIR"
        git pull origin main

        # ── 3. Build and start ────────────────────────────────────────────────
        echo "==> [3/5] Building and starting containers..."
        $COMPOSE up -d --build

        # ── 4. Wait for entrypoint to finish (migrate + collectstatic) ────────
        echo "==> [4/5] Waiting 30s for app startup..."
        sleep 30
        $COMPOSE ps

        # ── 5. Health check — accepts 200, 301, 302 ───────────────────────────
        echo "==> [5/5] Health check: $HEALTH_URL"

        MAX_RETRIES=8
        RETRY_DELAY=10
        ATTEMPT=0

        health_pass() {
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" 2>/dev/null || echo "000")
          echo "$HTTP"
          echo "$HTTP" | grep -qE "^(200|301|302)$"
        }

        until health_pass > /dev/null 2>&1; do
          ATTEMPT=$((ATTEMPT + 1))
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" 2>/dev/null || echo "000")
          echo "    Attempt $ATTEMPT/$MAX_RETRIES — HTTP $HTTP. Retrying in ${RETRY_DELAY}s..."

          if [ "$ATTEMPT" -ge "$MAX_RETRIES" ]; then
            echo "HEALTH CHECK FAILED. App logs:"
            $COMPOSE logs app --tail=25
            echo "Rolling back..."
            if docker image inspect "royal-land-pms:previous" > /dev/null 2>&1; then
              docker tag "royal-land-pms:previous" "$IMAGE"
              $COMPOSE up -d
              sleep 20
              HTTP_RB=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" 2>/dev/null || echo "000")
              echo "Post-rollback HTTP: $HTTP_RB"
            fi
            exit 1
          fi
          sleep "$RETRY_DELAY"
        done

        echo "Health check PASSED."
        echo "==> Deploy complete."
        $COMPOSE ps
      DEPLOY